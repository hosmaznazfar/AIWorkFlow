name: pj core
on:
  push:
    paths: ["pj-core/**", "pj", ".github/workflows/pj-core.yml"]
  pull_request:
    paths: ["pj-core/**", "pj", ".github/workflows/pj-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path pj-core/Cargo.toml
      - run: cargo fmt --manifest-path pj-core/Cargo.toml -- --check
      - run: cargo test --manifest-path pj-core/Cargo.toml
      - run: cargo clippy --manifest-path pj-core/Cargo.toml --all-targets
